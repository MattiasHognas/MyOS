name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Make the QEMU tests fail after running, to check that serial logs are uploaded"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Keep in sync with scripts/install-zig.sh (which pins the checksum).
  ZIG_VERSION: 0.17.1
  # One Zig cache directory per job, saved and restored by actions/cache.
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

jobs:
  build-and-test:
    name: Build and test (${{ matrix.optimize }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseFast]
    steps:
      - uses: actions/checkout@v7

      - name: Cache Zig toolchain
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zig
          key: zig-toolchain-${{ runner.os }}-${{ env.ZIG_VERSION }}

      - name: Install Zig
        run: |
          scripts/install-zig.sh "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Cache Zig build cache
        uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-cache-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ matrix.optimize }}-${{ hashFiles('build.zig', 'src/**', 'app/**', 'tests/**') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ matrix.optimize }}-

      - name: Install QEMU and xorriso
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso

      - name: Install Limine
        run: |
          scripts/install-limine.sh "$RUNNER_TEMP/limine"
          echo "LIMINE=$RUNNER_TEMP/limine" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/limine" >> "$GITHUB_PATH"

      - name: Fetch console font
        run: scripts/fetch-font.sh

      - name: Build kernel and apps
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Host unit tests
        run: zig build test-host --summary all

      - name: QEMU integration tests
        run: zig build test-qemu -Doptimize=${{ matrix.optimize }}
        env:
          MYOS_SIMULATE_FAILURE: ${{ inputs.simulate_failure }}

      - name: Build documentation
        if: matrix.optimize == 'Debug'
        run: zig build docs

      - name: Upload serial logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: serial-logs-${{ matrix.optimize }}
          path: zig-out/test/*/serial*.log
          if-no-files-found: ignore

      # The build cache only grows; start over once it passes 1 GiB.
      - name: Limit Zig build cache size
        if: always()
        run: |
          if [ -d .zig-cache ] && [ "$(du -sm .zig-cache | cut -f1)" -gt 1024 ]; then
            rm -rf .zig-cache
          fi

  coverage:
    name: Host test coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Coverage is informational; a kcov problem must not block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Cache Zig toolchain
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zig
          key: zig-toolchain-${{ runner.os }}-${{ env.ZIG_VERSION }}

      - name: Install Zig
        run: |
          scripts/install-zig.sh "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Cache Zig build cache
        uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-cache-${{ runner.os }}-${{ env.ZIG_VERSION }}-coverage-${{ hashFiles('build.zig', 'src/**', 'app/**', 'tests/**') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ env.ZIG_VERSION }}-coverage-

      # Ubuntu 24.04 has no kcov package, so build a pinned release.
      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake binutils-dev \
            libssl-dev libcurl4-openssl-dev libelf-dev zlib1g-dev libdw-dev libiberty-dev
          scripts/install-kcov.sh "$RUNNER_TEMP/kcov"
          echo "$RUNNER_TEMP/kcov/bin" >> "$GITHUB_PATH"

      - name: Run host tests under kcov
        run: zig build coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: host-coverage
          path: zig-out/coverage

      # The build cache only grows; start over once it passes 1 GiB.
      - name: Limit Zig build cache size
        if: always()
        run: |
          if [ -d .zig-cache ] && [ "$(du -sm .zig-cache | cut -f1)" -gt 1024 ]; then
            rm -rf .zig-cache
          fi
