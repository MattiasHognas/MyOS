name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Make the QEMU tests fail after running, to check that serial logs are uploaded"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The tool versions are in tools.versions: the install scripts install
  # them, and scripts/check-tools.sh (run by every build and test step)
  # fails the job if a tool on PATH is any other version. The caches of
  # the tools are keyed on that file, so changing any version there
  # rebuilds them all once.
  # One Zig cache directory per job, saved and restored by actions/cache.
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

jobs:
  build-and-test:
    name: Build and test (${{ matrix.optimize }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseFast]
    steps:
      - uses: actions/checkout@v7

      - name: Cache Zig toolchain
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zig
          key: zig-toolchain-${{ runner.os }}-${{ hashFiles('tools.versions') }}

      - name: Install Zig
        run: |
          scripts/install-zig.sh "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      # What is worth caching is what does not change between commits:
      # compiler-rt, the build runner and unchanged programs (about 80 s when
      # built from nothing). The kernel is recompiled on every change anyway,
      # in seconds. So the key is only the Zig version and build.zig: one
      # cache per job, saved once, built from an empty directory (no fallback
      # key), so it never accumulates old objects. Zig's cache is
      # content-addressed, so a restored cache cannot give stale results.
      - name: Cache Zig build cache
        uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-build-${{ runner.os }}-${{ matrix.optimize }}-${{ hashFiles('tools.versions', 'build.zig') }}

      # QEMU and xorriso are the versions MyOS is developed with, built from
      # pinned source releases (Ubuntu's packages are older) and cached.
      - name: Cache QEMU
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/qemu
          key: qemu-ubuntu-24.04-${{ hashFiles('tools.versions', 'scripts/install-qemu.sh') }}

      - name: Cache xorriso
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/xorriso
          key: xorriso-ubuntu-24.04-${{ hashFiles('tools.versions', 'scripts/install-xorriso.sh') }}

      # The packages are installed even when the caches are full: the cached
      # QEMU needs the shared libraries. binutils (objdump, for the stack
      # frame check) is the distribution's.
      - name: Install QEMU, xorriso and binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils \
            ninja-build pkg-config python3-venv libglib2.0-dev libpixman-1-dev
          scripts/install-qemu.sh "$RUNNER_TEMP/qemu"
          scripts/install-xorriso.sh "$RUNNER_TEMP/xorriso"
          echo "$RUNNER_TEMP/qemu/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/xorriso/bin" >> "$GITHUB_PATH"

      - name: Install Limine
        run: |
          scripts/install-limine.sh "$RUNNER_TEMP/limine"
          echo "LIMINE=$RUNNER_TEMP/limine" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/limine" >> "$GITHUB_PATH"

      # The builds and tests check this themselves; as a step of its own, a
      # wrong version is the first thing the log shows.
      - name: Check tool versions
        run: scripts/check-tools.sh zig limine qemu xorriso

      - name: Fetch console font
        run: scripts/fetch-font.sh

      - name: Build kernel and apps
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Host unit tests
        run: zig build test-host --summary all

      - name: Model checks of the blocking protocols
        if: matrix.optimize == 'Debug'
        run: zig build check-models --summary all

      - name: Release version script tests
        if: matrix.optimize == 'Debug'
        run: scripts/test-next-version.sh

      - name: Stack frame check script tests
        if: matrix.optimize == 'Debug'
        run: scripts/test-check-frames.sh

      - name: Tool version check script tests
        if: matrix.optimize == 'Debug'
        run: scripts/test-check-tools.sh

      - name: Kernel stack frame sizes
        run: zig build check-frames -Doptimize=${{ matrix.optimize }}

      - name: Syscall dispatch is direct in the normal kernel
        run: zig build check-dispatch -Doptimize=${{ matrix.optimize }}

      - name: QEMU integration tests
        run: zig build test-qemu -Doptimize=${{ matrix.optimize }}
        env:
          MYOS_SIMULATE_FAILURE: ${{ inputs.simulate_failure }}

      - name: Build documentation
        if: matrix.optimize == 'Debug'
        run: zig build docs

      - name: Upload serial logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: serial-logs-${{ matrix.optimize }}
          path: zig-out/test/*/serial*.log
          if-no-files-found: ignore

  # Every push to main that passes all three build-and-test jobs becomes a
  # GitHub release: tag v<major>.<minor>.<patch>, with the bootable ISO, the
  # kernel ELF (symbols) and checksums attached. <major>.<minor> comes from
  # the VERSION file, <patch> counts up automatically (scripts/next-version.sh).
  release:
    name: Release
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the tag and the release
    # One release at a time, in push order, so version numbers never collide.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to find the next version

      - name: Choose version
        id: version
        run: |
          if tag="$(git describe --tags --exact-match --match 'v*' 2>/dev/null)"; then
            echo "This commit is already released as $tag; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            version="$(scripts/next-version.sh)"
            echo "Releasing $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Zig toolchain
        if: steps.version.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zig
          key: zig-toolchain-${{ runner.os }}-${{ hashFiles('tools.versions') }}

      - name: Install Zig
        if: steps.version.outputs.skip != 'true'
        run: |
          scripts/install-zig.sh "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Cache xorriso
        if: steps.version.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/xorriso
          key: xorriso-ubuntu-24.04-${{ hashFiles('tools.versions', 'scripts/install-xorriso.sh') }}

      - name: Install xorriso
        if: steps.version.outputs.skip != 'true'
        run: |
          scripts/install-xorriso.sh "$RUNNER_TEMP/xorriso"
          echo "$RUNNER_TEMP/xorriso/bin" >> "$GITHUB_PATH"

      - name: Install Limine
        if: steps.version.outputs.skip != 'true'
        run: |
          scripts/install-limine.sh "$RUNNER_TEMP/limine"
          echo "LIMINE=$RUNNER_TEMP/limine" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/limine" >> "$GITHUB_PATH"

      - name: Check tool versions
        if: steps.version.outputs.skip != 'true'
        run: scripts/check-tools.sh zig limine xorriso

      - name: Fetch console font
        if: steps.version.outputs.skip != 'true'
        run: scripts/fetch-font.sh

      # No Zig build cache in this job, on purpose: the published image is
      # built from nothing, which also checks that a clean build works.
      - name: Build release image
        if: steps.version.outputs.skip != 'true'
        run: scripts/build.sh --release "${{ steps.version.outputs.version }}"

      # Creating the release also creates the tag on this commit. Versions
      # below 1.0 are marked as pre-releases.
      - name: Publish GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == 0.* ]]; then prerelease=(--prerelease); fi
          {
            echo "Bootable image of MyOS $VERSION (x86-64, BIOS and UEFI), built from ${GITHUB_SHA::7} after all tests passed."
            echo
            echo "Run it in QEMU:"
            echo
            echo '```'
            echo "qemu-system-x86_64 -machine q35 -cpu max -m 256M -serial stdio -cdrom myos-$VERSION.iso"
            echo '```'
            echo
            echo "\`myos-$VERSION-kernel.elf\` is the kernel with symbols, for symbolizing backtraces. Verify downloads with \`sha256sum -c SHA256SUMS\`."
            echo
            echo "The image includes the Limine bootloader and the default8x16 console font from the kbd project."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" \
            zig-out/release/myos-* zig-out/release/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "MyOS $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "${prerelease[@]}"

  coverage:
    name: Host test coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Coverage is informational; a kcov problem must not block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Cache Zig toolchain
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zig
          key: zig-toolchain-${{ runner.os }}-${{ hashFiles('tools.versions') }}

      - name: Install Zig
        run: |
          scripts/install-zig.sh "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      # Keyed like the build cache of the build-and-test jobs (see there).
      - name: Cache Zig build cache
        uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-build-${{ runner.os }}-coverage-${{ hashFiles('tools.versions', 'build.zig') }}

      - name: Cache kcov
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/kcov
          key: kcov-ubuntu-24.04-${{ hashFiles('tools.versions', 'scripts/install-kcov.sh') }}

      # Ubuntu 24.04 has no kcov package, so build a pinned release, unless
      # the cache already has it. The packages are installed either way: the
      # cached binary needs their shared libraries.
      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake binutils-dev \
            libssl-dev libcurl4-openssl-dev libelf-dev zlib1g-dev libdw-dev libiberty-dev
          scripts/install-kcov.sh "$RUNNER_TEMP/kcov"
          echo "$RUNNER_TEMP/kcov/bin" >> "$GITHUB_PATH"

      - name: Check tool versions
        run: scripts/check-tools.sh zig kcov

      - name: Run host tests under kcov
        run: zig build coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: host-coverage
          path: zig-out/coverage
